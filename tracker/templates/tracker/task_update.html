{% extends 'tracker/base.html' %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h1>✏️ Update Task</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <label>Task Title *</label>
        <input type="text" name="title" value="{{ task.title }}" required>
        
        <label>Description</label>
        <textarea name="description" rows="4">{{ task.description }}</textarea>
        
        <label>Priority *</label>
        <select name="priority" required>
            <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option>
            <option value="medium" {% if task.priority == 'medium' %}selected{% endif %}>Medium</option>
            <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option>
            <option value="urgent" {% if task.priority == 'urgent' %}selected{% endif %}>Urgent</option>
        </select>
        
        <label>Status *</label>
        <select name="status" required>
            <option value="todo" {% if task.status == 'todo' %}selected{% endif %}>To Do</option>
            <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>In Progress</option>
            <option value="waiting" {% if task.status == 'waiting' %}selected{% endif %}>Waiting</option>
            <option value="done" {% if task.status == 'done' %}selected{% endif %}>Done ✅</option>
        </select>
        
        <label>Due Date</label>
        <input type="datetime-local" name="due_date" value="{% if task.due_date %}{{ task.due_date|date:'Y-m-d\TH:i' }}{% endif %}">
        
        <label>Client</label>
        <select name="client">
            <option value="">No Client</option>
            {% for client in clients %}
            <option value="{{ client.id }}" {% if task.client and task.client.id == client.id %}selected{% endif %}>
                {{ client.name }} - {{ client.company }}
            </option>
            {% endfor %}
        </select>
        
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn btn-primary">Update Task</button>
            <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
    
    {% if task.completed_at %}
    <div style="margin-top: 2rem; padding: 1rem; background: #d4edda; border-radius: 8px;">
        ✅ Task completed on {{ task.completed_at|date:"M d, Y H:i" }}
    </div>
    {% endif %}
</div>
{% endblock %}
