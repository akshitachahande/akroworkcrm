{% extends 'tracker/base.html' %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h1>📝 Log Your Work</h1>
    <p style="color: #888; margin-bottom: 2rem;">Track what you accomplished today! 💪</p>
    
    <form method="post">
        {% csrf_token %}
        
        <label>What did you work on? *</label>
        <textarea name="description" rows="4" required placeholder="Describe what you accomplished..."></textarea>
        
        <label>Hours Worked *</label>
        <input type="number" name="hours" step="0.5" min="0" max="24" required placeholder="2.5">
        
        <label>Date *</label>
        <input type="date" name="date" value="{{ today }}" required>
        
        <label>Related Task (optional)</label>
        <select name="task">
            <option value="">No specific task</option>
            {% for task in tasks %}
            <option value="{{ task.id }}">{{ task.title }}</option>
            {% endfor %}
        </select>
        
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn btn-success">Log Work</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
